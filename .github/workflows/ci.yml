name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check internal/panel/web/app.js
      - run: node --test tests/panel-adopt.test.cjs
      - run: go test ./...
      - run: CGO_ENABLED=0 go build ./cmd/...
